name: Tamaño del PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar límites de .sdd/limits.json
        run: node scripts/check-pr-size.mjs
        env:
          SDD_BASE: origin/${{ github.base_ref }}
